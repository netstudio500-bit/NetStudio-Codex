<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To-Do (Local Storage)</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; max-width:800px; margin:2rem auto; padding:1rem; }
    h1 { font-size:1.6rem }
    .todo { display:flex; gap:0.5rem; align-items:center; padding:0.5rem; border-bottom:1px solid #eee }
    .todo input[type=text]{flex:1}
    .done { text-decoration:line-through; color:#777 }
    button { cursor:pointer }
    .controls { margin-top:1rem }
  </style>
</head>
<body>
  <h1>To-Do (salvo em localStorage)</h1>
  <p>Adicione tarefas — elas serão salvas no seu navegador (localStorage) e permanecerão entre recargas.</p>

  <div>
    <input id="newtext" type="text" placeholder="Nova tarefa..." />
    <button id="addbtn">Adicionar</button>
  </div>

  <div id="list" style="margin-top:1rem"></div>

  <div class="controls">
    <button id="clearDone">Remover concluídas</button>
    <button id="clearAll">Remover todas</button>
  </div>

  <script>
    const STORAGE_KEY = 'netstudio_todos_v1'

    function load() {
      const raw = localStorage.getItem(STORAGE_KEY)
      if (!raw) return []
      try { return JSON.parse(raw) } catch { return [] }
    }

    function save(items) { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)) }

    function render() {
      const list = document.getElementById('list')
      list.innerHTML = ''
      const items = load()
      if (!items.length) {
        list.innerHTML = '<p>Nenhuma tarefa.</p>'
        return
      }
      items.forEach(item => {
        const el = document.createElement('div')
        el.className = 'todo'
        const cb = document.createElement('input')
        cb.type = 'checkbox'
        cb.checked = item.done
        cb.addEventListener('change', () => {
          item.done = cb.checked
          save(items)
          render()
        })
        const txt = document.createElement('div')
        txt.textContent = item.text
        if (item.done) txt.classList.add('done')
        const del = document.createElement('button')
        del.textContent = 'Remover'
        del.addEventListener('click', () => {
          const i = items.findIndex(x => x.id === item.id)
          if (i !== -1) { items.splice(i,1); save(items); render() }
        })
        el.appendChild(cb)
        el.appendChild(txt)
        el.appendChild(del)
        list.appendChild(el)
      })
    }

    function add(text) {
      if (!text || !text.trim()) return
      const items = load()
      items.unshift({ id: Date.now().toString() + Math.random().toString(36).slice(2,8), text: text.trim(), done: false })
      save(items)
      render()
    }

    document.getElementById('addbtn').addEventListener('click', () => {
      const v = document.getElementById('newtext').value
      add(v)
      document.getElementById('newtext').value = ''
      document.getElementById('newtext').focus()
    })

    document.getElementById('newtext').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { document.getElementById('addbtn').click() }
    })

    document.getElementById('clearDone').addEventListener('click', () => {
      const items = load().filter(x => !x.done)
      save(items)
      render()
    })

    document.getElementById('clearAll').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY)
      render()
    })

    render()
  </script>
</body>
</html>
