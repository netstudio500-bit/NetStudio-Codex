[tool.poetry]
name = "netstudio-codex"
version = "0.1.0"
description = "Um Codex local, gratuito e modular para agentes de IA"
authors = ["NetStudio <contato@netstudio.dev>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/netstudio500-bit/NetStudio-Codex"
keywords = ["ai", "agents", "llm", "ollama", "codex", "modular"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0"
pydantic-settings = "^2.0"
requests = "^2.31"
aiohttp = "^3.9"
httpx = "^0.27"
fastapi = "^0.104"
uvicorn = "^0.24"
python-dotenv = "^1.0"
loguru = "^0.7"
sqlalchemy = "^2.0"
alembic = "^1.13"
scikit-learn = "^1.3"
numpy = "^1.26"
pydantic-extra-types = "^2.0"
typing-extensions = "^4.8"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
pytest-cov = "^4.1"
black = "^23.11"
isort = "^5.13"
ruff = "^0.1"
mypy = "^1.7"
pylint = "^3.0"
pre-commit = "^3.5"
ipython = "^8.18"
pytest-mock = "^3.12"
faker = "^20.1"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.2"
sphinx-rtd-theme = "^2.0"
mkdocs = "^1.5"
mkdocs-material = "^9.4"

[tool.poetry.scripts]
netstudio = "netstudio.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # diretórios
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "--cov=netstudio --cov-report=html --cov-report=term-missing -v"
log_level = "INFO"

[tool.coverage.run]
source = ["netstudio"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
