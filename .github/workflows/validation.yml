name: Validation
on:
  pull_request:
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry
      - run: poetry install --with dev --no-root
      - name: Capture diagnostics and formatted sources
        run: |
          poetry run ruff check . > ruff.txt 2>&1 || true
          poetry run pytest -q > pytest.txt 2>&1 || true
          poetry run black . > black.txt 2>&1
          mkdir formatted
          cp -r netstudio tests formatted/
      - uses: actions/upload-artifact@v4
        with:
          name: write-file-diagnostics
          path: |
            ruff.txt
            pytest.txt
            black.txt
            formatted
