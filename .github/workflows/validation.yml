name: Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, black, mypy, pytest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry
      - name: Install project dependencies
        run: poetry install --with dev --no-root
      - name: Run validation
        run: |
          case "${{ matrix.check }}" in
            ruff) poetry run ruff check . 2>&1 | tail -60 ; exit ${PIPESTATUS[0]} ;;
            black) poetry run black --check --diff . 2>&1 | grep -E '^[+-][^+-]' | base64 -w0; exit ${PIPESTATUS[0]} ;;
            mypy) poetry run mypy netstudio ;;
            pytest) poetry run pytest -q --tb=short 2>&1 | tail -100 ; exit ${PIPESTATUS[0]} ;;
          esac

  windows-shell:
    name: windows-shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry
      - name: Install project dependencies
        run: poetry install --with dev --no-root
      - name: Validate ShellTool and CLI integration on Windows
        run: poetry run pytest -v tests/unit/test_shell.py tests/unit/test_shell_command_parsing.py tests/unit/test_main.py
