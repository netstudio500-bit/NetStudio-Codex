name: Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, black, mypy, pytest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry
      - name: Install project dependencies
        run: poetry install --with dev --no-root
      - name: Run validation
        run: |
          case "${{ matrix.check }}" in
            ruff) poetry run ruff check . ;;
            black) poetry run black . ;;
            mypy) poetry run mypy netstudio ;;
            pytest) poetry run pytest -v ;;
          esac
      - name: Upload Black formatted tree
        if: matrix.check == 'black'
        uses: actions/upload-artifact@v4
        with:
          name: black-formatted-tree
          path: |
            netstudio
            tests
