name: Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, black, mypy, pytest]
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install --quiet poetry >/dev/null 2>&1
      - name: Install project dependencies
        run: poetry install --quiet --with dev --no-root >/dev/null 2>&1
      - name: Run validation
        run: |
          case "${{ matrix.check }}" in
            ruff) poetry run ruff check . ;;
            black) poetry run black --check . ;;
            mypy) poetry run mypy netstudio ;;
            pytest) poetry run pytest -v ;;
          esac
