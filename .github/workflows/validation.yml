name: Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, black, mypy, pytest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry
      - name: Install project dependencies
        run: poetry install --with dev --no-root
      - name: Run validation
        run: |
          case "${{ matrix.check }}" in
            ruff) poetry run ruff check . ;;
            black) poetry run black --check . ;;
            mypy) poetry run mypy netstudio ;;
            pytest)
              poetry run pytest -v tests/unit/test_search_text.py tests/unit/test_search_text_e2e.py
              poetry run pytest -v tests/unit/test_read_file.py tests/unit/test_list_files.py
              poetry run pytest -v tests/unit/test_main.py tests/unit/test_list_files_e2e.py
              poetry run pytest -v
              ;;
          esac

  windows-shell:
    name: windows-shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry
      - name: Install project dependencies
        run: poetry install --with dev --no-root
      - name: Validate workspace tools and CLI integration on Windows
        run: poetry run pytest -v tests/unit/test_shell.py tests/unit/test_shell_command_parsing.py tests/unit/test_read_file.py tests/unit/test_list_files.py tests/unit/test_list_files_e2e.py tests/unit/test_search_text.py tests/unit/test_search_text_e2e.py tests/unit/test_main.py
