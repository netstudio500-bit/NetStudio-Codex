version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: netstudio-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - netstudio

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netstudio-codex
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=postgresql://netstudio:netstudio@postgres:5432/netstudio
      - APP_ENV=production
    depends_on:
      - ollama
      - postgres
    volumes:
      - ./workspaces:/app/workspaces
      - ./plugins:/app/plugins
    networks:
      - netstudio
    command: python -m netstudio.main

  postgres:
    image: postgres:16-alpine
    container_name: netstudio-postgres
    environment:
      - POSTGRES_USER=netstudio
      - POSTGRES_PASSWORD=netstudio
      - POSTGRES_DB=netstudio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - netstudio

volumes:
  ollama_data:
  postgres_data:

networks:
  netstudio:
    driver: bridge
